<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Tani Cerdas Sumba Timur</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8f5;--c:#fff;--t:#12241a;--m:#58695f;--p:#0f6b3f;--pi:#fff;--l:#dfe8e2;--r:#c0392b;--h:#0b4a2e;--chip:#eaf4ee}
@media(prefers-color-scheme:dark){:root{--bg:#0d1611;--c:#15221a;--t:#e6f0e9;--m:#9bb1a2;--p:#4bc183;--pi:#05140b;--l:#243629;--h:#0a3a24;--chip:#1c2e23}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Public Sans",system-ui,sans-serif;background:var(--bg);color:var(--t)}
.top{position:sticky;top:0;z-index:30;height:56px;background:var(--h);color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:3px solid #16854f}
.top img{border-radius:9px}.top b{font-weight:800;margin-right:auto}.top span{font-size:13px;opacity:.85}
.top button{background:#ffffff1f;color:#fff;border:0;padding:7px 13px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
.wrap{display:flex;align-items:flex-start}
.side{width:224px;flex:none;background:var(--c);border-right:1px solid var(--l);padding:12px 8px;position:sticky;top:59px;height:calc(100vh - 59px)}
.side button{display:flex;gap:10px;align-items:center;width:100%;padding:11px 12px;margin-bottom:2px;border:0;background:none;color:var(--t);font:inherit;font-weight:600;border-radius:10px;cursor:pointer;text-align:left}
.side button.on{background:var(--chip);color:var(--p)}
main{flex:1;min-width:0;padding:20px;max-width:1000px}
@media(max-width:800px){.wrap{display:block}.side{display:flex;width:auto;height:auto;top:56px;z-index:25;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--l)}.side button{width:auto;white-space:nowrap;margin:0}main{padding:14px}}
h2{margin:0 0 14px;font-size:22px;font-weight:800;letter-spacing:-.01em}h3{margin:0 0 12px;font-size:17px;font-weight:800}
.car{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/7;min-height:170px;background:var(--h);margin-bottom:18px}
.car img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}.car img.on{opacity:1}
.cap{position:absolute;left:0;right:0;bottom:0;padding:44px 20px 16px;color:#fff;background:linear-gradient(transparent,rgba(5,30,18,.88))}
.cap b{display:block;font-size:20px;font-weight:800}.cap small{color:#ffffffd6}
.dots{position:absolute;right:14px;bottom:14px;display:flex;gap:7px}.dots i{width:9px;height:9px;border-radius:50%;background:#ffffff80;cursor:pointer}.dots i.on{background:#fff}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.sc{border-radius:12px;overflow:hidden;border:1px solid var(--l);background:var(--c)}
.sc .u{padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center}.sc .u b{font-size:34px;font-weight:800;line-height:1}.sc .u span{display:block;font-size:13px;font-weight:600;margin-top:4px}
.sc a{display:flex;justify-content:space-between;padding:9px 16px;font-size:13px;font-weight:700;color:var(--p);cursor:pointer}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:18px;margin-bottom:14px}
.pr{margin:10px 0}.pr small{display:flex;justify-content:space-between}.pr div{height:9px;background:var(--chip);border-radius:5px;margin-top:4px}.pr i{display:block;height:9px;background:var(--p);border-radius:5px}
.tl{border-left:3px solid var(--l);margin-left:6px;padding-left:18px}.tl>div{position:relative;margin-bottom:14px}.tl>div:before{content:"";position:absolute;left:-26px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--p)}.tl .w:before{background:#d99a1d}.tl .n:before{background:var(--l)}
.st{font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--chip);color:var(--p);margin-left:8px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px;background:var(--bg);color:var(--t);font:inherit;margin:4px 0 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p);outline-offset:1px}textarea{min-height:92px}label{font-size:13px;font-weight:600;color:var(--m)}
.btn{background:var(--p);color:var(--pi);border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font:inherit;font-weight:700}
.btn.x{background:var(--r);color:#fff}.btn.o{background:transparent;color:var(--p);border:1px solid var(--p)}.btn.w{background:#fff;color:var(--h);border-radius:999px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--l)}small{color:var(--m)}
.land{min-height:100vh;background:var(--bg)}.ln{background:var(--h);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 20px}.ln b{margin-right:auto;font-size:20px;font-weight:800}
.hero{background:var(--h);color:#fff;display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap;padding:30px 24px 24px}.hero>div{max-width:420px}
.hero h1{font-size:46px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em;line-height:1.1}.hero p{opacity:.9;margin:0 0 20px}.hero img{width:min(100%,380px);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.lg{max-width:380px;margin:-6px auto 40px;border-top:4px solid #16854f}#msg{color:var(--r);min-height:20px}
</style><style>
#muat{position:fixed;inset:0;z-index:99999;background:#0b4a2e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:"Public Sans",system-ui,sans-serif;transition:opacity .45s ease,visibility .45s}
#muat.selesai{opacity:0;visibility:hidden}
#muat img{width:64px;height:64px;border-radius:16px}
#muat b{font-size:20px;letter-spacing:.2px}
#muat .rg{width:34px;height:34px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:putarMuat .8s linear infinite}
#muat small{opacity:.8}
@keyframes putarMuat{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#muat .rg{animation-duration:2.4s}#muat{transition:none}}
</style></head><body>
<div id="muat" role="status" aria-live="polite"><img src="../icon.svg" alt=""><b>Tani Cerdas Sumba Timur</b><div class="rg"></div><small>Memuat dashboard admin...</small></div>

let tok=sessionStorage.tok||"",items=[],hist=[],view="dash",ed=null,msg="";let layarLogin=false;
const H=a=>({apikey:SB.key,...(a?{Authorization:"Bearer "+a}:{}),"Content-Type":"application/json"});
async function masuk(){
 try{const r=await fetch(SB.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:H(),body:JSON.stringify({email:$("#em").value,password:$("#pw").value})});
  const j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||"Gagal masuk");
  tok=sessionStorage.tok=j.access_token;await load();render()}catch(e){msg=e.message;render()}}
function keluar(){tok="";sessionStorage.tok="";layarLogin=false;msg="";render()}
async function load(){
 const r=await fetch(SB.url+"/rest/v1/kb?id=eq.1&select=data",{headers:H(tok)});
 if(r.status==401){keluar();return}
 const j=await r.json();items=j[0]?j[0].data:JSON.parse(JSON.stringify(D));
 const h=await fetch(SB.url+"/rest/v1/riwayat?select=*&order=created_at.desc&limit=200",{headers:H(tok)});hist=h.ok?await h.json():[]}
async function simpan(){
 const r=await fetch(SB.url+"/rest/v1/kb",{method:"POST",headers:{...H(tok),Prefer:"resolution=merge-duplicates"},body:JSON.stringify({id:1,data:items,updated_at:new Date().toISOString()})});
 if(!r.ok)throw Error("Gagal menyimpan ("+r.status+")")}
function edit(i){ed=i;view="form";msg="";render()}
async function hapus(i){if(!confirm("Hapus "+items[i].n+"?"))return;const b=items.splice(i,1);try{await simpan()}catch(e){items.splice(i,0,...b);msg=e.message}render()}
async function submitForm(){
 const num=(v,d)=>{v=parseFloat(String(v).replace(",","."));return isNaN(v)?d:Math.min(1,Math.max(0,v))};
 const rows=$("#fg").value.split("\n").map(x=>x.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(s=>s.trim());return[p[0],num(p[1],.8),num(p[2],.1)]});
 const d={t:$("#ft").value,n:$("#fn").value.trim(),k:$("#fk").value,s:$("#fs").checked?1:0,
  w:$("#fw").value.split(",").map(x=>+x.trim()).filter(x=>x>=1&&x<=12),
  g:rows.map(r=>r[0]),m:rows.map(r=>[r[1],r[2]]),c:$("#fc").value.split("\n").map(x=>x.trim()).filter(Boolean)};
 if(!d.n||!d.g.length){msg="Nama dan minimal satu gejala wajib diisi.";render();return}
 const old=items.slice();ed===-1?items.push(d):items[ed]=d;
 try{await simpan();view="data";msg="Tersimpan. Aplikasi petani akan mengambil data baru saat online."}catch(e){items=old;msg=e.message}render()}
function nav(v){view=v;ed=null;msg="";render()}

const SL=[[IMG_LAHAN,"Diagnosa langsung dari lahan","Petani memeriksa tanaman lewat HP, kapan saja dan di mana saja."],[IMG_SEHAT,"Kenali penyakit lebih dini","Sistem pakar membantu mengenali hama dan penyakit sebelum meluas."]];
let sl=0,slT=null;
function slide(n){sl=(n+SL.length)%SL.length;document.querySelectorAll(".car img").forEach((e,i)=>e.classList.toggle("on",i===sl));document.querySelectorAll(".dots i").forEach((e,i)=>e.classList.toggle("on",i===sl));const c=$(".cap");if(c)c.innerHTML=`<b>${SL[sl][1]}</b><small>${SL[sl][2]}</small>`}
function autoSlide(){clearInterval(slT);if(view==="dash"&&tok&&!matchMedia("(prefers-reduced-motion:reduce)").matches)slT=setInterval(()=>slide(sl+1),5000)}
const LOG=[["Selesai","Aplikasi petani","Pustaka, Kalender, dan Cek gejala. Bisa dibuka tanpa internet dan dipasang di layar utama HP."],["Selesai","Metode Certainty Factor","Hasil Cek gejala berupa persentase kepastian dari nilai MB dan MD tiap gejala."],["Selesai","Halaman admin pakar","Pakar mengelola penyakit, gejala, nilai MB/MD, dan saran penanganan."],["Selesai","Balasan pakar","Pakar membalas diagnosa petani, dan petani membacanya di menu Balasan."],["Selesai","Diagnosa foto (AI)","Petani memotret tanaman, AI memberi perkiraan penyebab."],["Berjalan","Pengisian data penyuluhan","Memasukkan data hama dan penyakit dari penyuluhan ke basis pengetahuan."],["Rencana","Impor data dari Excel/CSV","Memasukkan dataset pakar sekaligus."],["Rencana","Cetak laporan diagnosa","Hasil diagnosa dalam bentuk laporan yang bisa dicetak."]];
function dash(){
 const nG=items.reduce((a,d)=>a+d.g.length,0),uG=new Set(items.flatMap(d=>d.g)).size,wm=items.filter(d=>d.m&&d.m.length).length,dib=hist.filter(h=>h.balasan).length;
 const C=[["leaf","Data Penyakit",items.length,"data","#0b4a2e"],["list","Data Gejala",uG,"data","#0f6b3f"],["book","Basis Pengetahuan",nG,"data","#16854f"],["chat","Total Diagnosa",hist.length,"riwayat","#1f9a5e"],["check","Sudah Dibalas",dib,"riwayat","#0f6b3f"],["clock","Menunggu Balasan",hist.length-dib,"riwayat","#16854f"]];
 const pr=(l,a,b)=>`<div class="pr"><small><span>${l}</span><span>${a} dari ${b}</span></small><div><i style="width:${b?Math.round(a/b*100):0}%"></i></div></div>`;
 return`<div class="car">${SL.map((x,i)=>`<img src="${x[0]}" alt="" class="${i===sl?"on":""}">`).join("")}<div class="cap"><b>${SL[sl][1]}</b><small>${SL[sl][2]}</small></div><div class="dots">${SL.map((x,i)=>`<i class="${i===sl?"on":""}" onclick="slide(${i});autoSlide()"></i>`).join("")}</div></div>
 <div class="g">${C.map(([i,l,v,go,col])=>`<div class="sc"><div class="u" style="background:${col}"><div><b>${v}</b><span>${l}</span></div>${ic(i,40)}</div><a onclick="nav('${go}')"><span>Selengkapnya</span><span>›</span></a></div>`).join("")}</div>
 <div class="card"><h3>Perkembangan Sistem <span class="st">Versi 1.0</span></h3>${pr("Penyakit dengan nilai MB/MD dari pakar",wm,items.length)}${pr("Diagnosa petani yang sudah dibalas",dib,hist.length)}<br><div class="tl">${LOG.map(([s,j,i])=>`<div class="${s==="Berjalan"?"w":s==="Rencana"?"n":""}"><b>${j}</b><span class="st">${s}</span><br><small>${i}</small></div>`).join("")}</div></div>`}
function data(){return`<button class="btn" onclick="edit(-1)">+ Tambah penyakit/hama</button><div class="card" style="margin-top:12px">${items.map((d,i)=>`<div class="row"><div><b>${esc(d.n)}</b><br><small>${esc(d.t)} · ${esc(d.k)} · ${d.g.length} gejala</small></div><div><button class="btn o" onclick="edit(${i})">Ubah</button> <button class="btn x" onclick="hapus(${i})">Hapus</button></div></div>`).join("")}</div>`}
function form(){const d=ed===-1?{t:"padi",k:"Hama",s:0,w:[],g:[],m:[],c:[],n:""}:items[ed];
 const opt=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
 return`<div class="card"><b>${ed===-1?"Tambah":"Ubah"} data</b><br>

 <textarea id="fg">${esc(d.g.map((g,i)=>`${g} | ${(d.m&&d.m[i]||[.8,.1])[0]} | ${(d.m&&d.m[i]||[.8,.1])[1]}`).join("\n"))}</textarea>
 <label>Saran penanganan, satu per baris</label><textarea id="fc">${esc(d.c.join("\n"))}</textarea>
 <button class="btn" onclick="submitForm()">Simpan</button> <button class="btn o" onclick="nav('data')">Batal</button></div>`}
function bukaFoto(i){const h=hist[i];if(!h||!h.foto)return;
 const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out";
 const im=document.createElement("img");im.src=h.foto;im.style.cssText="max-width:100%;max-height:100%;border-radius:10px";
 o.appendChild(im);o.onclick=()=>o.remove();document.body.appendChild(o)}
function detailPetani(h){

 const a=Array.isArray(h.hasil_ai)&&h.hasil_ai.length?`<div style="margin-top:4px"><small><b>Hasil AI foto:</b> ${h.hasil_ai.map(x=>esc(x.nama)+" "+Math.round((x.keyakinan||0)*100)+"%").join(", ")}</small></div>`:"";
 const f=h.foto&&/^data:image\//.test(h.foto)?`<div style="margin-top:8px"><img src="${h.foto}" alt="Foto tanaman dari petani" onclick="bukaFoto(${hist.indexOf(h)})" style="max-width:240px;width:100%;border-radius:10px;border:1px solid var(--l);cursor:zoom-in"><br><small>Klik foto untuk memperbesar</small></div>`:"";
 return g+a+f}

<button class="btn" onclick="balas(${i})">${h.balasan?"Perbarui balasan":"Kirim balasan"}</button> <button class="btn o" onclick="isiStandar(${i})">Isi dari saran standar</button>${h.dibalas_at?` <small>Dibalas ${new Date(h.dibalas_at).toLocaleString("id-ID")}</small>`:""}</div>`).join(""):"<small>Belum ada diagnosa masuk.</small>"}</div>`}

 const at=new Date().toISOString();

</div>`;return}
 if(!tok){clearInterval(slT);$("#app").innerHTML=`<div class="land"><div class="ln"><img src="../icon.svg" width="34" height="34" alt="" style="border-radius:9px"><b>Tani Cerdas</b><button class="btn w" onclick="layarLogin=false;msg='';render()">Kembali</button></div>

 const T=[["dash","home","Beranda"],["data","book","Basis Pengetahuan"],["riwayat","chat","Riwayat Diagnosa"]],H={dash:"Beranda",data:"Basis Pengetahuan",form:"Basis Pengetahuan",riwayat:"Riwayat Diagnosa"};
 $("#app").innerHTML=`<div class="top"><img src="../icon.svg" width="34" height="34" alt=""><b>Admin Tani Cerdas</b><span>Administrator</span><button onclick="keluar()">Keluar</button></div>
 <div class="wrap"><aside class="side">${T.map(([k,i,l])=>`<button class="${view===k||(view==="form"&&k==="data")?"on":""}" onclick="nav('${k}')">${ic(i,18)}${l}</button>`).join("")}</aside>
 <main><h2>${H[view]}</h2>${msg?`<div class="card" id="msg">${esc(msg)}</div>`:""}${({dash,data,form,riwayat})[view]()}</main></div>`;autoSlide()}
if(tok)load().then(render);else render();
</script>

<!-- ===== Tambahan admin (dulu js/tambahan-admin.js), dipasang setelah script utama ===== -->
<script>
(function () {
  const BLN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  let imp = null;

  /* ---------- 1. Status pengembangan ---------- */
  [
    ["Pengisian data penyuluhan", "Data hama dan penyakit dari penyuluhan sudah dimasukkan ke basis pengetahuan."],
    ["Impor data dari Excel/CSV", "Pakar mengunggah file Excel atau CSV untuk memasukkan banyak penyakit sekaligus."],
    ["Cetak laporan diagnosa", "Hasil diagnosa bisa dicetak sebagai laporan, satu per satu atau rekap semuanya."]
  ].forEach(function (x) {
    const r = LOG.find(function (l) { return l[1] === x[0]; });
    if (r) { r[0] = "Selesai"; r[2] = x[1]; }
  });

  /* ---------- 2. Impor Excel/CSV ---------- */
  const norm = function (s) { return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]+/g, ""); };
  const AL = {
    nama: ["nama", "namapenyakit", "namahama", "penyakit", "n"],
    tanaman: ["tanaman", "t"],
    jenis: ["jenis", "kategori", "k"],
    sumba: ["sumbatimur", "sumba", "tercatat", "s"],
    bulan: ["bulan", "bulanwaspada", "w"],
    gejala: ["gejala", "g"],
    mb: ["mb", "nilaimb"],
    md: ["md", "nilaimd"],
    saran: ["saran", "penanganan", "saranpenanganan", "c"]
  };
  const TAN = { padi: "padi", jagung: "jagung", sayur: "sayur", sayuran: "sayur", cabai: "sayur", lombok: "sayur", tomat: "sayur", bawang: "sayur", bawangmerah: "sayur", sawi: "sayur" };
  const nilai = function (v) {
    const x = parseFloat(String(v).trim().replace(",", "."));
    return isNaN(x) || x < 0 || x > 1 ? null : x;
  };
  const idx = function (d) {
    return items.findIndex(function (x) { return x.n.toLowerCase() === d.n.toLowerCase() && x.t === d.t; });
  };

  function parseCSV(t) {
    t = String(t).replace(/^\uFEFF/, "");
    const first = t.split(/\r?\n/)[0] || "";
    const cnt = function (c) { return first.split(c).length - 1; };
    const del = [";", "\t", ","].reduce(function (b, c) { return cnt(c) > cnt(b) ? c : b; }, ",");
    const rows = [];
    let row = [], cell = "", q = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) {
        if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === del) { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && t[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function proses(aoa, fn) {
    const rows = aoa
      .map(function (r, i) { return { r: r, no: i + 1 }; })
      .filter(function (o) { return o.r.some(function (c) { return String(c == null ? "" : c).trim() !== ""; }); });
    if (!rows.length) throw Error("File kosong.");
    const head = rows.shift().r.map(norm), col = {};
    Object.keys(AL).forEach(function (k) {
      const ix = head.findIndex(function (h) { return AL[k].indexOf(h) >= 0; });
      if (ix >= 0) col[k] = ix;
    });
    const hilang = ["nama", "tanaman", "jenis", "gejala", "mb", "md"].filter(function (k) { return !(k in col); });
    if (hilang.length) throw Error("Kolom tidak ditemukan: " + hilang.join(", ") + ". Pakai template dari tombol Unduh template CSV.");
    const cell = function (r, k) { return k in col ? String(r[col[k]] == null ? "" : r[col[k]]).trim() : ""; };
    const grp = new Map(), err = [];
    let last = null, nG = 0;
    rows.forEach(function (o) {
      const r = o.r, no = o.no;
      let n = cell(r, "nama"), t = cell(r, "tanaman"), k = cell(r, "jenis");
      const g = cell(r, "gejala");
      if (!n && last) { n = last.n; t = t || last.t; k = k || last.k; }
      else if (last && n.toLowerCase() === last.n.toLowerCase()) { t = t || last.t; k = k || last.k; }
      if (!n) { err.push("Baris " + no + ": nama penyakit kosong."); return; }
      last = { n: n, t: t, k: k };
      const tt = TAN[norm(t)], kk = { hama: "Hama", penyakit: "Penyakit" }[norm(k)];
      if (!tt) { err.push("Baris " + no + ": tanaman \"" + t + "\" tidak dikenali (padi, jagung, atau sayur/cabai)."); return; }
      if (!kk) { err.push("Baris " + no + ": jenis harus Hama atau Penyakit."); return; }
      if (!g) { err.push("Baris " + no + ": gejala kosong."); return; }
      const mb = nilai(cell(r, "mb")), md = nilai(cell(r, "md"));
      if (mb === null || md === null) { err.push("Baris " + no + ": MB dan MD harus angka 0 sampai 1."); return; }
      const key = n.toLowerCase() + "|" + tt;
      let d = grp.get(key);
      if (!d) { d = { t: tt, n: n, k: kk, s: 0, w: [], g: [], m: [], c: [] }; grp.set(key, d); }
      if (d.g.some(function (x) { return x.toLowerCase() === g.toLowerCase(); })) {
        err.push("Baris " + no + ": gejala sama sudah ada pada " + n + ", dilewati."); return;
      }
      d.g.push(g); d.m.push([mb, md]); nG++;
      if (["1", "ya", "y", "iya", "true", "v"].indexOf(norm(cell(r, "sumba"))) >= 0) d.s = 1;
      cell(r, "bulan").split(/[^0-9]+/).filter(Boolean).map(Number).forEach(function (x) {
        if (x >= 1 && x <= 12 && d.w.indexOf(x) < 0) d.w.push(x);
      });
      cell(r, "saran").split(/\n/).map(function (x) { return x.trim(); }).filter(Boolean).forEach(function (x) {
        if (d.c.indexOf(x) < 0) d.c.push(x);
      });
    });
    return { fn: fn, daftar: Array.from(grp.values()), err: err, nG: nG, mode: "gabung" };
  }

  const muatXLSX = function () {
    if (window.XLSX) return Promise.resolve();
    return new Promise(function (ok, gagal) {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = ok;
      s.onerror = function () { gagal(Error("Pustaka Excel tidak bisa dimuat (butuh internet). Simpan file sebagai CSV lalu impor lagi.")); };
      document.head.appendChild(s);
    });
  };

  function panel() {
    let h = '<div class="card"><b>Impor dari Excel/CSV</b><br>' +
      '<small>Satu baris berisi satu gejala. Baris dengan nama penyakit yang sama digabung otomatis. ' +
      'Kolom: nama, tanaman, jenis, sumba_timur, bulan_waspada, gejala, mb, md, saran.</small><br><br>' +
      '<button class="btn" onclick="document.getElementById(\'impf\').click()">Pilih file Excel/CSV</button> ' +
      '<button class="btn o" onclick="impTemplate()">Unduh template CSV</button>' +
      '<input id="impf" type="file" accept=".csv,.txt,.xlsx,.xls" style="display:none" onchange="impBaca(this.files[0])">';
    if (imp) {
      const baru = imp.daftar.filter(function (d) { return idx(d) < 0; }).length, upd = imp.daftar.length - baru;
      h += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--l)"><b>' + esc(imp.fn) + '</b><br>' +
        '<small>Terbaca ' + imp.daftar.length + ' penyakit/hama dengan ' + imp.nG + ' gejala: ' + baru + ' baru, ' + upd + ' sudah ada.' +
        (imp.err.length ? ' ' + imp.err.length + ' baris dilewati.' : '') + '</small>';
      if (imp.err.length) {
        h += '<div style="margin:8px 0;color:var(--r);font-size:13px">' + imp.err.slice(0, 8).map(function (e) { return esc(e); }).join("<br>") +
          (imp.err.length > 8 ? "<br>dan " + (imp.err.length - 8) + " lainnya." : "") + '</div>';
      }
      if (imp.daftar.length) {
        const rd = function (v, t) {
          return '<label style="display:block;margin:4px 0;font-weight:500"><input type="radio" name="impm" value="' + v + '" ' +
            (imp.mode === v ? "checked" : "") + ' onchange="impMode(this.value)" style="width:auto;padding:0;margin:0 6px 0 0">' + t + '</label>';
        };
        h += '<div style="margin:10px 0">' +
          rd("gabung", "Gabungkan: tambah yang baru, ganti isi yang namanya sama") +
          rd("ganti", "Ganti semua data dengan isi file") + '</div>' +
          '<button class="btn" onclick="impTerapkan()">Impor sekarang</button> <button class="btn o" onclick="impBatal()">Batal</button>';
      } else {
        h += '<br><button class="btn o" onclick="impBatal()">Tutup</button>';
      }
      h += '</div>';
    }
    return h + '</div>';
  }

  window.impBaca = async function (f) {
    if (!f) return;
    msg = "";
    try {
      let aoa;
      if (/\.(xlsx|xls)$/i.test(f.name)) {
        await muatXLSX();
        const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
        aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" });
      } else aoa = parseCSV(await f.text());
      imp = proses(aoa, f.name);
    } catch (e) { imp = null; msg = "Gagal membaca file: " + e.message; }
    render();
  };
  window.impMode = function (v) { if (imp) imp.mode = v; };
  window.impBatal = function () { imp = null; render(); };
  window.impTerapkan = async function () {
    if (!imp || !imp.daftar.length) return;
    const lama = items.slice();
    let tambah = 0, ubah = 0;
    if (imp.mode === "ganti") {
      if (!confirm("Semua data penyakit yang ada sekarang akan diganti dengan isi file (" + imp.daftar.length + " penyakit/hama). Lanjutkan?")) return;
      items = imp.daftar.slice(); tambah = imp.daftar.length;
    } else {
      items = items.slice();
      imp.daftar.forEach(function (d) {
        const i = idx(d);
        if (i >= 0) { items[i] = d; ubah++; } else { items.push(d); tambah++; }
      });
    }
    try {
      await simpan();
      msg = "Impor berhasil: " + tambah + " ditambahkan, " + ubah + " diperbarui. Aplikasi petani akan mengambil data baru saat online.";
      imp = null;
    } catch (e) { items = lama; msg = "Impor gagal: " + e.message; }
    render();
  };
  window.impTemplate = function () {
    const b = [
      ["nama", "tanaman", "jenis", "sumba_timur", "bulan_waspada", "gejala", "mb", "md", "saran"],
      ["Contoh penyakit padi", "padi", "Penyakit", "1", "11 12 1", "Contoh gejala pertama", "0,8", "0,1", "Contoh saran penanganan"],
      ["", "", "", "", "", "Contoh gejala kedua", "0,6", "0,2", ""]
    ];
    const csv = "\ufeff" + b.map(function (r) { return r.join(";"); }).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "template-impor-pakar.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };
  window.impParseCSV = parseCSV;
  window.impProses = proses;

  /* ---------- 3. Cetak laporan diagnosa ---------- */
  const CSSP = '@page{size:A4;margin:18mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
    'body{font:12.5px/1.55 "Segoe UI",Arial,sans-serif;color:#111;margin:0}' +
    '.kop{border-bottom:3px solid #0b4a2e;padding-bottom:10px;margin-bottom:16px}' +
    '.kop b{display:block;font-size:18px;color:#0b4a2e}.kop span{color:#555}' +
    'h1{font-size:16px;margin:0 0 10px}h2{font-size:13.5px;margin:18px 0 6px;color:#0b4a2e}' +
    'table{width:100%;border-collapse:collapse}th,td{border:1px solid #bbb;padding:6px 8px;text-align:left;vertical-align:top}' +
    'th{background:#eaf4ee}tr{break-inside:avoid}.id td:first-child{width:32%;background:#f6f9f7;font-weight:600}' +
    '.box{border:1px solid #bbb;padding:8px 10px;white-space:pre-wrap}ol{margin:0;padding-left:20px}' +
    '.cat{margin-top:18px;font-size:11.5px;color:#555}.kecil{font-size:11px;color:#555;margin-top:6px}' +
    '.ttd{margin-top:34px;display:flex;justify-content:flex-end;break-inside:avoid}.ttd>div{width:220px;text-align:center}.gr{height:64px}';
  const KOP = '<div class="kop"><b>Tani Cerdas Sumba Timur</b><span>Sistem pakar hama dan penyakit tanaman, metode Certainty Factor</span></div>';
  const tgl = function (s) {
    if (!s) return "-";
    const d = new Date(s);
    return isNaN(d) ? "-" : d.toLocaleString("id-ID", { dateStyle: "long", timeStyle: "short" });
  };
  const urut = function (a) { return (a || []).slice().sort(function (x, y) { return y.cf - x.cf; }); };

  function cetak(judul, isi) {
    const f = document.createElement("iframe");
    f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(f);
    const w = f.contentWindow, d = w.document;
    d.open();
    d.write('<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>' + esc(judul) + '</title><style>' + CSSP + '</style></head><body>' + isi + '</body></html>');
    d.close();
    setTimeout(function () { w.focus(); w.print(); setTimeout(function () { f.remove(); }, 60000); }, 300);
  }

  function satu(h) {
    const hs = urut(h.hasil), top = hs[0], kb = top && items.find(function (d) { return d.n === top.nama; });
    const gj = Array.isArray(h.gejala) ? h.gejala.map(function (x) { return typeof x === "string" ? x : (x && (x.teks || x.nama)) || ""; }).filter(Boolean) : [];
    let o = KOP + '<h1>Laporan Hasil Diagnosa</h1><table class="id">' +
      '<tr><td>Nama petani</td><td>' + esc(h.nama) + '</td></tr>' +
      '<tr><td>Tanaman</td><td>' + esc(h.tanaman) + '</td></tr>' +
      '<tr><td>Tanggal diagnosa</td><td>' + esc(tgl(h.created_at)) + '</td></tr>' +
      '<tr><td>Kode diagnosa</td><td>' + esc((h.kode || "-").slice(0, 6)) + '</td></tr></table>';
    o += '<h2>Hasil diagnosa</h2>' + (hs.length
      ? '<table><tr><th style="width:36px">No</th><th>Penyakit/hama</th><th style="width:120px">Kepastian (CF)</th></tr>' +
        hs.map(function (x, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(x.nama) + '</td><td>' + esc(x.cf) + '%</td></tr>'; }).join("") + '</table>'
      : '<p>Tidak ada penyakit atau hama yang cocok dengan gejala yang dipilih.</p>');
    if (gj.length) o += '<h2>Gejala yang dipilih</h2><ol>' + gj.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ol>';
    if (kb) {
      o += '<h2>Informasi ' + esc(kb.n) + '</h2><table class="id"><tr><td>Jenis</td><td>' + esc(kb.k) + '</td></tr><tr><td>Tanaman</td><td>' + esc(kb.t) + '</td></tr>' +
        (kb.w && kb.w.length ? '<tr><td>Bulan waspada</td><td>' + esc(kb.w.map(function (m) { return BLN[m - 1]; }).filter(Boolean).join(", ")) + '</td></tr>' : '') + '</table>';
      if (kb.c && kb.c.length) o += '<h2>Saran penanganan</h2><ol>' + kb.c.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ol>';
    }
    o += '<h2>Balasan pakar</h2>' + (h.balasan
      ? '<div class="box">' + esc(h.balasan) + '</div><div class="kecil">Dibalas ' + esc(tgl(h.dibalas_at)) + '</div>'
      : '<p>Belum dibalas pakar.</p>');
    o += '<p class="cat">Hasil ini adalah perkiraan berdasarkan gejala yang dipilih petani. Untuk kepastian, konsultasikan dengan penyuluh pertanian setempat.</p>' +
      '<div class="ttd"><div>Pakar/Penyuluh<div class="gr"></div>(................................)</div></div>' +
      '<div class="kecil">Dicetak ' + esc(tgl(new Date())) + '</div>';
    return o;
  }

  function rekap() {
    const dib = hist.filter(function (h) { return h.balasan; }).length;
    const baris = hist.map(function (h, i) {
      const t = urut(h.hasil)[0];
      return '<tr><td>' + (i + 1) + '</td><td>' + esc(tgl(h.created_at)) + '</td><td>' + esc(h.nama) + '</td><td>' + esc(h.tanaman) + '</td><td>' +
        (t ? esc(t.nama) + " (" + esc(t.cf) + "%)" : "-") + '</td><td>' + (h.balasan ? "Sudah dibalas" : "Menunggu") + '</td></tr>';
    }).join("");
    return KOP + '<h1>Rekap Riwayat Diagnosa</h1><p>Total ' + hist.length + ' diagnosa: ' + dib + ' sudah dibalas, ' + (hist.length - dib) + ' menunggu balasan.' +
      (hist.length >= 200 ? ' Yang dimuat adalah 200 diagnosa terbaru.' : '') + '</p>' +
      '<table><tr><th style="width:36px">No</th><th>Tanggal</th><th>Petani</th><th>Tanaman</th><th>Hasil teratas</th><th>Status</th></tr>' + baris + '</table>' +
      '<div class="kecil">Dicetak ' + esc(tgl(new Date())) + '</div>';
  }

  window.cetakDiagnosa = function (i) { const h = hist[i]; if (h) cetak("Laporan diagnosa " + (h.nama || ""), satu(h)); };
  window.cetakRekap = function () { cetak("Rekap riwayat diagnosa", rekap()); };

  /* ---------- 5. Hapus diagnosa ---------- */
  window.hapusDiagnosa = async function (i) {
    const h = hist[i];
    if (!h) return;
    if (!confirm("Hapus diagnosa dari " + (h.nama || "petani") + "? Data yang dihapus tidak bisa dikembalikan.")) return;
    try {
      const r = await fetch(SB.url + "/rest/v1/riwayat?id=eq." + encodeURIComponent(h.id), {
        method: "DELETE",
        headers: Object.assign({}, H(tok), { Prefer: "return=representation" })
      });
      if (!r.ok) throw Error("kode " + r.status);
      const dihapus = await r.json();
      if (!Array.isArray(dihapus) || !dihapus.length) {
        throw Error("tidak ada data yang terhapus. Izin hapus (policy DELETE) di Supabase kemungkinan belum diaktifkan");
      }
      hist.splice(i, 1);
      msg = "Diagnosa dihapus.";
    } catch (e) { msg = "Gagal menghapus diagnosa: " + e.message; }
    render();
  };

  /* ---------- 4. Lengkapi MB/MD yang kosong (bawaan 0,8 dan 0,1) ---------- */
  let sedangSimpan = false;
  function lengkapiMBMD() {
    let berubah = false;
    items.forEach(function (d) {
      if (!Array.isArray(d.m)) { d.m = []; berubah = true; }
      for (let i = 0; i < d.g.length; i++) {
        const v = d.m[i];
        if (!Array.isArray(v) || v.length < 2 || typeof v[0] !== "number" || typeof v[1] !== "number") {
          d.m[i] = [0.8, 0.1]; berubah = true;
        }
      }
      if (d.m.length > d.g.length) { d.m.length = d.g.length; berubah = true; }
    });
    if (berubah && !sedangSimpan) {
      sedangSimpan = true;
      simpan().then(function () { sedangSimpan = false; }, function () { sedangSimpan = false; });
    }
  }

  /* ---------- Pasang ke halaman yang sudah ada ---------- */
  const _dash = dash;
  dash = function () { lengkapiMBMD(); return _dash(); };

  const _data = data;
  data = function () { lengkapiMBMD(); return panel() + _data(); };

  const _riwayat = riwayat;
  riwayat = function () {
    const h = _riwayat().replace(
      /(<button class="btn o" onclick="isiStandar\((\d+)\)">Isi dari saran standar<\/button>)/g,
      '$1 <button class="btn o" onclick="cetakDiagnosa($2)">Cetak laporan</button> <button class="btn x" onclick="hapusDiagnosa($2)">Hapus</button>'
    );
    const atas = hist.length ? '<div style="margin-bottom:12px"><button class="btn o" onclick="cetakRekap()">Cetak rekap semua</button></div>' : "";
    return atas + h;
  };
})();
</script>
</body></html>
